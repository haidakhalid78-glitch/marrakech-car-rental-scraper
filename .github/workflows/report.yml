name: Genera Report Automatico

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  crea-report:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Esegui lo script
        run: python noleggi.py

      - name: Salva il report generato
        uses: actions/upload-artifact@v4
        with:
          name: cartella-reports
          path: reports
